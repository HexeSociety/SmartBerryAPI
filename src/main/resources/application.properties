
# ==========================================
# SMARTBERRY 360 - CONFIGURACOES DA API
# ==========================================

# Identificacao da aplicacao
spring.application.name=smartberry

# Porta do servidor
server.port=${SERVER_PORT:8080}

# ==========================================
# MONGODB
# ==========================================

# URI de conexao com o MongoDB.
# Padrao: banco local na porta 27017.
# Para outros ambientes, definir a variavel MONGODB_URI.
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/smartberry}
